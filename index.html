<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Notas - Instituto i3</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="contenedor">
        <h1>Instituto i3</h1>
        <h2>Calculadora de Notas</h2>

        <form id="formularioNotas">
            <label for="nombre">Nombre del estudiante:</label>
            <input
                type="text"
                id="nombre"
                placeholder="Ingresa tu nombre"
                required
            >

            <label for="nota1">Primera nota:</label>
            <input
                type="number"
                id="nota1"
                min="0"
                max="5"
                step="0.1"
                placeholder="0.0 - 5.0"
                required
            >

            <label for="nota2">Segunda nota:</label>
            <input
                type="number"
                id="nota2"
                min="0"
                max="5"
                step="0.1"
                placeholder="0.0 - 5.0"
                required
            >

            <label for="nota3">Tercera nota:</label>
            <input
                type="number"
                id="nota3"
                min="0"
                max="5"
                step="0.1"
                placeholder="0.0 - 5.0"
                required
            >

            <button type="submit">Calcular</button>
        </form>

        <section id="resultado" class="resultado" aria-live="polite">
            <p>Ingresa tus datos para calcular el promedio.</p>
        </section>
    </main>

    <script>
        // La lógica del cálculo se conectará aquí.
    </script>

</body>
</html>
